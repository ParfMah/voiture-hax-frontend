<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Catalogo veicoli Hax-ISA — Auto nuove e usate disponibili in Europa." />
  <title>Catalogo Veicoli — Hax-ISA</title>

  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/catalogue.css" />
  <link rel="stylesheet" href="../css/footer.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml" />
</head>
<body class="page-catalogue" data-page="catalogue">

  <header id="main-header" class="header">
    <nav id="main-nav" class="navbar" role="navigation" aria-label="Navigazione principale"></nav>
  </header>

  <main id="main-content">

    <!-- Bannière page catalogue -->
    <section class="page-banner" aria-label="Catalogo veicoli">
      <div class="page-banner__content">
        <h1 class="page-banner__title">Catalogo Veicoli</h1>
        <p class="page-banner__subtitle">Trova l'auto dei tuoi sogni — Nuova o Usata</p>
      </div>
    </section>

    <!-- Bloc filtres + résultats -->
    <section class="catalogue-section">
      <div class="container">
        <div class="catalogue-layout">

          <!-- Panneau filtres latéral -->
          <aside id="filters-panel" class="filters-panel" aria-label="Filtri di ricerca">
            <!-- Injecté par js/pages/catalogue.js -->
          </aside>

          <!-- Résultats / grille véhicules -->
          <div class="catalogue-main">
            <!-- Barre de recherche + tri -->
            <div id="catalogue-toolbar" class="catalogue-toolbar">
              <!-- Injecté par js/pages/catalogue.js -->
            </div>
            <!-- Grille véhicules -->
            <div id="vehicles-grid" class="vehicles-grid" aria-live="polite" aria-label="Lista veicoli">
              <!-- Injecté dynamiquement par JS -->
            </div>
            <!-- Pagination -->
            <div id="catalogue-pagination" class="pagination" aria-label="Paginazione"></div>
          </div>

        </div>
      </div>
    </section>

  </main>

  <footer id="main-footer" class="footer" role="contentinfo"></footer>
  <div id="page-loader" class="page-loader" aria-hidden="true">
    <div class="loader-content">
      <div class="loader-logo">HAX-ISA</div>
      <div class="loader-spinner"></div>
    </div>
  </div>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <div id="modal-container" class="modal-container" role="dialog" aria-modal="true" aria-hidden="true"></div>

  <script src="../js/config.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script src="../js/utils/api.js"></script>
  <script src="../js/utils/storage.js"></script>
  <script src="../js/components/navbar.js"></script>
  <script src="../js/components/footer.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/loader.js"></script>
  <script src="../js/pages/catalogue.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
