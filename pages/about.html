<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Chi siamo — Hax-ISA International Sale of Automobiles" />
  <title>Chi Siamo — Hax-ISA</title>

  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/about.css" />
  <link rel="stylesheet" href="../css/footer.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml" />
</head>
<body class="page-about" data-page="about">

  <header id="main-header" class="header">
    <nav id="main-nav" class="navbar" role="navigation" aria-label="Navigazione principale"></nav>
  </header>

  <main id="main-content">

    <section class="page-banner page-banner--about" aria-label="Chi siamo">
      <div class="page-banner__content">
        <h1 class="page-banner__title">Chi Siamo</h1>
        <p class="page-banner__subtitle">La tua fiducia è il nostro motore</p>
      </div>
    </section>

    <section id="about-content" class="about-content-section">
      <div class="container">
        <div id="about-main" class="about-main">
          <!-- Injecté par js/pages/about.js -->
        </div>
      </div>
    </section>

  </main>

  <footer id="main-footer" class="footer" role="contentinfo"></footer>
  <div id="page-loader" class="page-loader" aria-hidden="true">
    <div class="loader-content">
      <div class="loader-logo">HAX-ISA</div>
      <div class="loader-spinner"></div>
    </div>
  </div>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <div id="modal-container" class="modal-container" role="dialog" aria-modal="true" aria-hidden="true"></div>

  <script src="../js/config.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script src="../js/utils/api.js"></script>
  <script src="../js/utils/storage.js"></script>
  <script src="../js/components/navbar.js"></script>
  <script src="../js/components/footer.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/loader.js"></script>
  <script src="../js/pages/about.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
