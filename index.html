<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Hax-ISA — International Sale of Automobiles. Acquista la tua auto nuova o usata in Europa." />
  <meta name="keywords" content="auto nuove, auto usate, vendita automobili, Europa, credito auto" />
  <meta name="author" content="Hax-ISA" />

  <title>Hax-ISA — International Sale of Automobiles</title>

  <!-- Feuilles de style principales -->
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/hero.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/animations.css" />

  <!-- Icônes SVG inline via JS -->
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
</head>
<body class="page-home" data-page="home">

  <!-- ===== HEADER / NAVBAR ===== -->
  <header id="main-header" class="header">
    <nav id="main-nav" class="navbar" role="navigation" aria-label="Navigazione principale">
      <!-- Contenu injecté par js/components/navbar.js -->
    </nav>
  </header>

  <!-- ===== CONTENU PRINCIPAL ===== -->
  <main id="main-content">

    <!-- Section Hero -->
    <section id="hero" class="hero" aria-label="Benvenuto in Hax-ISA">
      <!-- Contenu injecté par js/pages/home.js -->
    </section>

    <!-- Section Services -->
    <section id="services" class="section-services" aria-label="I nostri servizi">
    </section>

    <!-- Section Véhicules en vedette -->
    <section id="featured-vehicles" class="section-featured" aria-label="Veicoli in evidenza">
    </section>

    <!-- Section Simulateur crédit (teaser) -->
    <section id="credit-teaser" class="section-credit-teaser" aria-label="Simulatore di credito">
    </section>

    <!-- Section À propos -->
    <section id="about" class="section-about" aria-label="Chi siamo">
    </section>

    <!-- Section Témoignages -->
    <section id="testimonials" class="section-testimonials" aria-label="Testimonianze">
    </section>

  </main>

  <!-- ===== FOOTER ===== -->
  <footer id="main-footer" class="footer" role="contentinfo">
    <!-- Contenu injecté par js/components/footer.js -->
  </footer>

  <!-- ===== OVERLAY CHARGEMENT ===== -->
  <div id="page-loader" class="page-loader" aria-hidden="true">
    <div class="loader-content">
      <div class="loader-logo">HAX-ISA</div>
      <div class="loader-spinner"></div>
    </div>
  </div>

  <!-- ===== NOTIFICATION TOAST ===== -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- ===== MODAL CONTAINER ===== -->
  <div id="modal-container" class="modal-container" role="dialog" aria-modal="true" aria-hidden="true"></div>

  <!-- Scripts JS — ordre de chargement important -->
  <script src="js/config.js"></script>
  <script src="js/utils/helpers.js"></script>
  <script src="js/utils/api.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/components/footer.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/loader.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
